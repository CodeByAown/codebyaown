<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="t d">
  <title id="t">Aown Abbas: Full Stack Laravel Developer and Agentic AI Engineer</title>
  <desc id="d">A request reaches an AI agent, the agent uses vector search, MCP tools and read-only APIs, and every action waits for human approval before it runs.</desc>
  <defs>
    <pattern id="grid-light" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e4e2dc" stroke-width="1" opacity="0.55"/>
    </pattern>
    <radialGradient id="glow-light" cx="0.78" cy="0.35" r="0.55">
      <stop offset="0%" stop-color="#9a6d00" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#9a6d00" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade-light" x1="0" x2="1">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.15"/>
      <stop offset="55%" stop-color="#fff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0.35"/>
    </linearGradient>
    <mask id="m-light"><rect width="1200" height="340" fill="url(#fade-light)"/></mask>
    <clipPath id="c-light"><rect x="1" y="1" width="1198" height="338" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#c-light)">
    <rect width="1200" height="340" fill="#fbfbfa"/>
    <rect width="1200" height="340" fill="url(#grid-light)" mask="url(#m-light)"/>
    <rect width="1200" height="340" fill="url(#glow-light)"/>
  </g>
  <rect x="1" y="1" width="1198" height="338" rx="18" fill="none" stroke="#e4e2dc" stroke-width="1.5"/>

  <!-- identity -->
  <rect x="58" y="62" width="30" height="3" rx="1.5" fill="#9a6d00"/>
  <text x="58" y="94" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="14" letter-spacing="2.4" fill="#9a6d00">AOWN ABBAS</text>
  <text x="56" y="152" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="42" font-weight="700" letter-spacing="-0.8" fill="#1f2328">Full Stack Laravel Developer</text>
  <text x="56" y="203" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="42" font-weight="700" letter-spacing="-0.8" fill="#1f2328">&amp; <tspan fill="#9a6d00">Agentic AI Engineer</tspan></text>
  <text x="58" y="242" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#5d636e">LLM agents, tool calling, RAG and human-approved workflows,</text>
  <text x="58" y="265" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#5d636e">built into real Laravel and Python systems.</text>
  <g><rect x="58" y="283" width="129" height="28" rx="14" fill="none" stroke="#cfccc2" stroke-width="1"/>
      <text x="122.5" y="301.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#5d636e">PHP · Laravel</text></g>
    <g><rect x="195" y="283" width="152" height="28" rx="14" fill="none" stroke="#cfccc2" stroke-width="1"/>
      <text x="271" y="301.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#5d636e">Python · FastAPI</text></g>
    <g><rect x="355" y="283" width="105" height="28" rx="14" fill="none" stroke="#cfccc2" stroke-width="1"/>
      <text x="407.5" y="301.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#5d636e">LLM agents</text></g>
    <g><rect x="468" y="283" width="50" height="28" rx="14" fill="none" stroke="#cfccc2" stroke-width="1"/>
      <text x="493" y="301.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#5d636e">RAG</text></g>
    <g><rect x="526" y="283" width="50" height="28" rx="14" fill="none" stroke="#cfccc2" stroke-width="1"/>
      <text x="551" y="301.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#5d636e">MCP</text></g>

  <!-- agent loop -->
  <g fill="none" stroke-linecap="round">
    <path d="M 843 92 C 875 92, 865 140, 897 158" stroke="#cfccc2" stroke-width="1.4" stroke-dasharray="4 5"/>
    <path d="M 973 150.5 C 1025 138.8, 978 92, 1022 92" stroke="#cfccc2" stroke-width="1.3"/>
    <path d="M 973 170 C 1025 170, 978 170, 1022 170" stroke="#cfccc2" stroke-width="1.3"/>
    <path d="M 973 189.5 C 1025 201.2, 978 248, 1022 248" stroke="#cfccc2" stroke-width="1.3"/>
    <path d="M 941 208 L 955 263" stroke="#9a6d00" stroke-width="1.6" stroke-dasharray="4 4"/>
    <path d="M 877 280 L 839 280" stroke="#9a6d00" stroke-width="1.8"/>
    <path d="M 847 275 L 839 280 L 847 285" stroke="#9a6d00" stroke-width="1.8" stroke-linejoin="round"/>
  </g>

  <g>
    <rect x="747" y="75" width="96" height="34" rx="17" fill="#ffffff" stroke="#cfccc2" stroke-width="1.2"/>
    <text x="795" y="96.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#5d636e">request</text>
  </g>
  <g>
    <rect x="1022" y="75" width="132" height="34" rx="17" fill="#ffffff" stroke="#cfccc2" stroke-width="1.2"/>
    <text x="1088" y="96.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#0969da">vector search</text>
  </g>
  <g>
    <rect x="1022" y="153" width="132" height="34" rx="17" fill="#ffffff" stroke="#cfccc2" stroke-width="1.2"/>
    <text x="1088" y="174.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#0969da">MCP tools</text>
  </g>
  <g>
    <rect x="1022" y="231" width="132" height="34" rx="17" fill="#ffffff" stroke="#cfccc2" stroke-width="1.2"/>
    <text x="1088" y="252.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#0969da">read-only APIs</text>
  </g>
  <g>
    <rect x="877" y="263" width="156" height="34" rx="17" fill="rgba(154,109,0,0.08)" stroke="#9a6d00" stroke-width="1.2"/>
    <text x="955" y="284.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#9a6d00">human approval</text>
  </g>
  <g>
    <rect x="751" y="263" width="88" height="34" rx="17" fill="#ffffff" stroke="#cfccc2" stroke-width="1.2"/>
    <text x="795" y="284.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#1a7f37">action</text>
  </g>

  <!-- the agent node, with a slow pulse -->
  <circle cx="935" cy="170" r="38" fill="none" stroke="#0969da" stroke-width="1.2" opacity="0.5">
    <animate attributeName="r" values="38;52;38" dur="3.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.45;0;0.45" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="935" cy="170" r="38" fill="#ffffff" stroke="#0969da" stroke-width="1.6"/>
  <text x="935" y="168" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#0969da">agent</text>
  <text x="935" y="185" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#5d636e">tool loop</text>

  <!-- packets -->
  <circle r="4" fill="#0969da"><animateMotion dur="2.6s" repeatCount="indefinite" path="M 843 92 C 875 92, 865 140, 897 158"/></circle>
  <circle r="3.2" fill="#0969da" opacity="0.9"><animateMotion dur="2.2s" begin="0s" repeatCount="indefinite" keyPoints="0;1;0" keyTimes="0;0.5;1" calcMode="linear" path="M 973 150.5 C 1025 138.8, 978 92, 1022 92"/></circle>
  <circle r="3.2" fill="#0969da" opacity="0.9"><animateMotion dur="2.5500000000000003s" begin="0.5s" repeatCount="indefinite" keyPoints="0;1;0" keyTimes="0;0.5;1" calcMode="linear" path="M 973 170 C 1025 170, 978 170, 1022 170"/></circle>
  <circle r="3.2" fill="#0969da" opacity="0.9"><animateMotion dur="2.9000000000000004s" begin="1s" repeatCount="indefinite" keyPoints="0;1;0" keyTimes="0;0.5;1" calcMode="linear" path="M 973 189.5 C 1025 201.2, 978 248, 1022 248"/></circle>
  <circle r="4" fill="#9a6d00"><animateMotion dur="3s" begin="0.8s" repeatCount="indefinite" path="M 941 208 L 955 263 L 877 280 L 839 280"/></circle>

  <text x="1142" y="42" text-anchor="end" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="12" letter-spacing="1.4" fill="#5d636e">MODELS PROPOSE · PEOPLE APPROVE</text>
</svg>
